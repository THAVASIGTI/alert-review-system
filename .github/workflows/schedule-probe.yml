name: Schedule probe

# TEMPORARY diagnostic: proves whether GitHub runs cron schedules for this repo at all.
# Delete this file once a "Scheduled" run shows up here.
on:
  schedule:
    - cron: "*/5 * * * *"     # GitHub minimum interval
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - run: echo "event=${{ github.event_name }} at $(date -u +%H:%M:%S) UTC"
