name: Review alert

on:
  schedule:
    # Every 5 min (GitHub's minimum interval). GitHub may delay or skip scheduled runs under load.
    #   "*/5 * * * *" every 5m  |  "7,22,37,52 * * * *" every 15m  |  "7 * * * *" hourly
    # What scheduled runs do is set by the repo variable SCHEDULE_MODE (default: normal).
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "normal | seed (store without mail) | dry-run (no db, no mail) | test-mail (send sample mail only)"
        default: "normal"
        type: choice
        options: [normal, seed, dry-run, test-mail]

permissions:
  contents: write               # commit data/reviews.db back

concurrency:
  group: review-alert           # never two runs writing the db at once
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Official Playwright image: Python 3.12, Chromium for Playwright 1.58, its system libs,
    # xvfb and git are preinstalled -> no apt/browser download on every run.
    # The tag must match the playwright version in requirements.txt.
    container:
      image: mcr.microsoft.com/playwright/python:v1.58.0-noble
      options: --ipc=host       # recommended for Chromium in Docker
    steps:
      - uses: actions/checkout@v4

      - name: Install Python packages
        run: |
          for i in 1 2 3; do
            pip install --root-user-action=ignore -r requirements.txt && exit 0
            echo "retry $i"; sleep 15
          done; exit 1

      - name: Check reviews
        # Headed Chromium inside a virtual display: Google CAPTCHAs headless browsers much more often.
        env:
          QUERIES: ${{ vars.QUERIES }}            # optional repo variables (Settings > Variables)
          LIMIT: ${{ vars.LIMIT }}
          RATING_LIMIT: ${{ vars.RATING_LIMIT }}
          GL: ${{ vars.GL }}
          SMTP_USER: ${{ secrets.SMTP_USER }}     # repo secrets (Settings > Secrets)
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          # manual run: the chosen mode | scheduled run: repo variable SCHEDULE_MODE, else normal
          MODE: ${{ inputs.mode || vars.SCHEDULE_MODE || 'normal' }}
        run: |
          echo "Mode: $MODE (${{ github.event_name }})"
          case "$MODE" in
            seed)    FLAG=--seed; echo "::warning::seed mode: new reviews are stored but NO alert mail is sent" ;;
            dry-run) FLAG=--dry-run ;;
            test-mail) python main.py --test-mail; exit $? ;;
            *)       FLAG= ;;
          esac
          xvfb-run --auto-servernum --server-args="-screen 0 1366x900x24" python main.py $FLAG

      - name: Upload snapshot / error screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reviews-${{ github.run_id }}
          path: output/
          retention-days: 7
          if-no-files-found: ignore

      - name: Commit review db
        if: always()              # keep newly stored reviews even if the mail step failed
        run: |
          [ -f data/reviews.db ] || exit 0
          git config --global --add safe.directory "$GITHUB_WORKSPACE"   # repo owned by another uid in the container
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reviews.db
          if git diff --cached --quiet; then echo "No db changes"; exit 0; fi
          git commit -m "reviews db: $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin "${GITHUB_REF_NAME}"   # in case keepalive pushed meanwhile
          git push
